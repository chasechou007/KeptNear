[package]
name = "keptnear-client"
version = "0.1.0"
description = "First-party local client for the authenticated KeptNear credential Broker."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
psw-broker = { path = "../psw-broker" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.9.4"
security-framework-sys = { version = "=2.9.1", features = ["OSX_10_15"] }

[dev-dependencies]
serde_json = "=1.0.150"

[lints.rust]
# The crate remains deny-by-default. The audited macOS Keychain adapter calls
# Security.framework where safe Rust wrappers do not expose Data Protection
# and non-synchronizing attributes together.
unsafe_code = "allow"
