[package]
name = "psw-core"
version = "0.1.0"
description = "Core vault logic for the PSW local-first password manager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
argon2 = "0.5.3"
base64ct = "=1.6.0"
chacha20poly1305 = "0.10.1"
csv = "1.3.1"
hex = "0.4.3"
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha1 = "0.10.6"
zeroize = "=1.8.1"

[lints]
workspace = true
