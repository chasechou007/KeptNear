[package]
name = "psw-core"
version = "0.1.0"
description = "Core encrypted vault logic for the KeptNear local password and token manager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
argon2 = "0.5.3"
base64ct = "=1.6.0"
bech32 = "=0.11.0"
chacha20poly1305 = "0.10.1"
csv = "1.3.1"
fs2 = "=0.4.3"
hex = "0.4.3"
hkdf = "=0.12.3"
hmac = "0.12.1"
libc = "0.2.182"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha1 = "0.10.6"
sha2 = "0.10.8"
zeroize = "=1.8.1"

[lints]
workspace = true
