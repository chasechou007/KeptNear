[package]
name = "psw-cli"
version = "0.1.0"
description = "KeptNear local vault and credential command-line tools."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
default-run = "psw"

[[bin]]
name = "psw"
path = "src/main.rs"

[[bin]]
name = "keptnear"
path = "src/keptnear.rs"

[dependencies]
base64 = "=0.22.1"
keptnear-client = { path = "../keptnear-client" }
psw-broker = { path = "../psw-broker" }
psw-core = { path = "../psw-core" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
zeroize = "=1.8.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.182"

[lints]
workspace = true
