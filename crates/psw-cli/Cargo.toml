[package]
name = "psw-cli"
version = "0.1.0"
description = "Command-line tools for PSW local vaults."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "psw"
path = "src/main.rs"

[dependencies]
psw-core = { path = "../psw-core" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

[lints]
workspace = true
