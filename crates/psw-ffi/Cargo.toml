[package]
name = "psw-ffi"
version = "0.1.0"
description = "C ABI bridge for the KeptNear macOS client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "keptnear-app-metadata"
path = "src/app_metadata.rs"

[[bin]]
name = "keptnear-package-manifest"
path = "src/package_manifest.rs"

[dependencies]
psw-broker = { path = "../psw-broker" }
psw-core = { path = "../psw-core" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha2 = "=0.10.9"
zeroize = "=1.8.1"

[lints.rust]
unsafe_code = "allow"
