[package]
name = "psw-ffi"
version = "0.1.0"
description = "C ABI bridge for the PSW macOS client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
psw-core = { path = "../psw-core" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

[lints.rust]
unsafe_code = "allow"
